<!DOCTYPE html>
<html lang="ar" dir="rtl" class="puck-linux">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>PUCK LINUX IN</title>
<style>
:root{--ink:#0a0b0f;--fg:#f5f7f8;--accent:#7dffcc;--dim:#8c8c8c;--card:#1a1c24;--elev:#22242e;--border:rgba(125,255,204,.22)}
*{box-sizing:border-box;cursor:none!important}
html,body{margin:0;height:100%;background:var(--ink);color:var(--fg);font:15px/1.4 -apple-system,system-ui,sans-serif;overflow:hidden}
body{position:relative}
#screen{position:absolute;inset:0;background:#000;overflow:hidden}
#screen canvas{image-rendering:pixelated;width:100%;height:100%;object-fit:contain;display:block}
#peekhit{position:absolute;inset:0 0 auto 0;height:44px;z-index:20;background:transparent;border:0}
#peek{display:none;position:absolute;inset:0 0 auto 0;z-index:30;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));align-items:center;justify-content:space-between}
#peek.on{display:flex}
#peek p{margin:0;font:12px ui-monospace,Menlo,monospace;color:var(--accent);letter-spacing:.08em;pointer-events:none}
#peek .row{display:flex;gap:8px}
.btn{height:44px;min-width:44px;border:0;border-radius:8px;background:var(--elev);color:var(--fg);padding:0 12px;font-weight:600;font-size:12px}
#splash,#boot{position:absolute;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
#boot{inset:12px auto auto 12px;top:12px;left:12px;right:auto;justify-content:flex-start;padding:0;align-items:flex-start}
#splash h1,#boot h1{margin:0;font-size:22px;letter-spacing:.12em;font-weight:650}
#splash .sub{margin-top:8px;color:var(--accent);font:12px ui-monospace,Menlo,monospace}
.bar{height:4px;width:12rem;background:var(--elev);border-radius:2px;margin-top:20px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.card{background:rgba(26,28,36,.86);border:1px solid var(--border);border-radius:8px;padding:8px 12px;width:min(24rem,92%)}
#boot .bar{width:100%;margin-top:8px}
#sheet{display:none;position:absolute;inset:0;z-index:40;background:rgba(10,11,15,.7);align-items:flex-end;justify-content:center;padding:12px}
#sheet.on{display:flex}
.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;max-width:40rem;width:100%;max-height:80%;overflow:auto}
.panel h2{margin:0 0 10px;font-size:18px}
.panel p,.panel li{color:var(--fg);font-size:14px;line-height:1.5}
.panel a{color:var(--accent)}
</style>
</head>
<body>
<div id="screen"></div>
<button id="peekhit" type="button" aria-label="قائمة المضيف"></button>
<div id="peek">
  <p>PUCK LINUX IN</p>
  <div class="row">
    <button class="btn" id="bLic" type="button">تراخيص</button>
    <button class="btn" id="bPtr" type="button">مؤشر</button>
    <button class="btn" id="bRe" type="button">إعادة</button>
  </div>
</div>
<div id="splash">
  <h1>PUCK LINUX IN</h1>
  <div class="sub">Linux 6.13.7-arch1 · i686</div>
  <div class="bar"><i id="prog"></i></div>
</div>
<div id="boot" style="display:none">
  <div class="card" style="width:auto;padding:6px 10px">
    <h1 style="font-size:10px;letter-spacing:.08em;color:var(--accent);font-family:ui-monospace,Menlo,monospace;margin:0">PUCK LINUX IN</h1>
  </div>
</div>
<div id="sheet" class="puck-sheet">
  <div class="panel" id="panel"></div>
</div>
<script>
window.global = window;
if (typeof window.setImmediate !== "function") {
  window.setImmediate = function (fn) { return window.setTimeout(fn, 0); };
}
</script>
<script src="libv86.js"></script>
<script>
(function () {
  var screenEl = document.getElementById("screen");
  var splash = document.getElementById("splash");
  var boot = document.getElementById("boot");
  var prog = document.getElementById("prog");
  var peek = document.getElementById("peek");
  var sheet = document.getElementById("sheet");
  var panel = document.getElementById("panel");
  var emu = null;
  var startedX = false;
  var lastLock = 0;
  var peekTimer = 0;
  var phase = "load";

  function hideHostCursor() {
    document.documentElement.classList.add("puck-linux");
    document.body.style.cursor = "none";
    var c = screenEl.querySelector("canvas");
    if (c) c.style.cursor = "none";
  }
  function nativeMsg(msg) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.puck) {
      window.webkit.messageHandlers.puck.postMessage(msg);
    }
  }
  function nativeLock() { nativeMsg("lock"); }
  function isChrome(t) {
    return t && t.closest && t.closest("button, a, .puck-sheet, #peek, #sheet");
  }
  function grabMouse(e) {
    if (e && isChrome(e.target)) return;
    hideHostCursor();
    nativeLock();
    if (!emu) return;
    try { emu.mouse_set_enabled(true); } catch (err) {}
    try { emu.keyboard_set_enabled(true); } catch (err) {}
    if (!e) return;
    var now = Date.now();
    if (now - lastLock < 350) return;
    lastLock = now;
    try {
      var p = emu.lock_mouse();
      if (p && p.catch) p.catch(function () {});
    } catch (err) {}
    var canvas = screenEl.querySelector("canvas");
    try {
      if (canvas && canvas.requestPointerLock) {
        var r = canvas.requestPointerLock({ unadjustedMovement: true });
        if (r && r.catch) r.catch(function () {});
      }
    } catch (err2) {
      try {
        if (canvas && canvas.requestPointerLock) {
          var r2 = canvas.requestPointerLock();
          if (r2 && r2.catch) r2.catch(function () {});
        }
      } catch (err3) {}
    }
  }
  function canvasLooksLikeDesktop() {
    var canvas = screenEl.querySelector("canvas");
    if (!canvas || canvas.style.display === "none") return false;
    if (canvas.width < 320 || canvas.height < 200) return false;
    try {
      var ctx = canvas.getContext("2d");
      if (!ctx) return false;
      var w = canvas.width, h = canvas.height;
      var data = ctx.getImageData(0, 0, w, h).data;
      var step = 16, non = 0, total = 0;
      for (var y = 0; y < h; y += step) {
        for (var x = 0; x < w; x += step) {
          var i = (y * w + x) * 4;
          total++;
          if (data[i] + data[i + 1] + data[i + 2] > 40) non++;
        }
      }
      return total > 0 && non / total > 0.08;
    } catch (e) { return false; }
  }
  function tryStartX(force) {
    if (!emu) return;
    if (startedX && !force) return;
    startedX = true;
    try {
      emu.keyboard_send_text(
        "\nrm -f /usr/lib/libLLVM* /usr/lib/dri/*swrast*\necho '#!/bin/sh' > /root/.xinitrc\necho 'exec fluxbox' >> /root/.xinitrc\nchmod +x /root/.xinitrc\nstartx\n",
        30
      );
    } catch (err) {}
  }
  function markDesk() {
    phase = "desk";
    splash.style.display = "none";
    boot.style.display = "none";
    hideHostCursor();
    nativeLock();
  }
  function showSheet(html) {
    panel.innerHTML = html + '<p><button class="btn" id="xSheet" type="button">إغلاق</button></p>';
    sheet.className = "puck-sheet on";
    document.getElementById("xSheet").onclick = function () { sheet.className = "puck-sheet"; };
  }
  sheet.addEventListener("click", function (e) {
    if (e.target === sheet) sheet.className = "puck-sheet";
  });
  document.getElementById("bLic").onclick = function () {
    showSheet(
      "<h2>Puck Linux · تراخيص</h2>" +
      "<p>هذا حاسوب لينكس مدمج داخل التطبيق. الضيف <b>Arch Linux i686</b>، النواة <b>6.13.7-arch1-1.0-ARCH32</b> مع Xorg وFluxbox وFirefox وpacman. النواة GPL-2.0 من Arch Linux 32.</p>" +
      "<p>الآيفون لا يفتح Hypervisor.framework ولا Virtualization.framework لتطبيقات الطرف الثالث — حتى على iOS 27. VirtualMac يعمل على آيباد M-series فقط. المسار الفعلي هنا: محاكاة x86 عبر v86 وWebAssembly JIT.</p>" +
      "<ul>" +
      "<li><a href='https://www.kernel.org/'>Linux 6.13.7-arch1-1.0-ARCH32</a> — GPL-2.0 · <a href='https://archlinux32.org/'>archlinux32.org</a></li>" +
      "<li>Arch Linux i686 — Xorg / Firefox / pacman · <a href='https://copy.sh/v86/?profile=archlinux'>copy.sh/v86</a></li>" +
      "<li><a href='https://github.com/copy/v86'>v86</a> — BSD-2-Clause</li>" +
      "<li>SeaBIOS / VGA BIOS — LGPL</li>" +
      "</ul>"
    );
  };
  document.getElementById("bPtr").onclick = function () {
    nativeMsg("a11y");
    showSheet(
      "<h2>مؤشر لينكس</h2>" +
      "<p>مؤشر لينكس الأسود هو مؤشر X11 داخل النظام الضيف. Puck يخفي مؤشر UIKit ويلتقط الفأرة عبر تفضيل قفل المؤشر ومسار Game Controller.</p>" +
      "<p>المثلث الأبيض إن بقي هو مؤشر اللمس المساعد في iOS — طبقة تسهيلات فوق كل التطبيقات. أوقفه مؤقتاً من الإعدادات ← تسهيلات الاستخدام ← لمس أثناء عمل لينكس ليبقى مؤشر لينكس وحده. أعد تشغيله عندما تريد مؤشراً على الشاشة الرئيسية.</p>"
    );
  };
  document.getElementById("bRe").onclick = function () {
    startedX = false;
    phase = "boot";
    splash.style.display = "none";
    boot.style.display = "flex";
    peek.className = "";
    if (emu) emu.restart();
    setTimeout(function () {
      startedX = true;
      try { emu.keyboard_send_text("\nrm -f /usr/lib/libLLVM* /usr/lib/dri/*swrast*\necho '#!/bin/sh' > /root/.xinitrc\necho 'exec fluxbox' >> /root/.xinitrc\nchmod +x /root/.xinitrc\nstartx\n", 30); } catch (e) {}
      grabMouse();
    }, 900);
  };
  document.getElementById("peekhit").onclick = function () {
    peek.className = "on";
    clearTimeout(peekTimer);
    peekTimer = setTimeout(function () { peek.className = ""; }, 2800);
  };

  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("pointerlockchange", hideHostCursor);
  document.addEventListener("pointerdown", grabMouse, true);
  document.addEventListener("pointermove", grabMouse, true);
  screenEl.addEventListener("click", grabMouse);
  hideHostCursor();
  nativeLock();

  emu = new V86({
    wasm_path: "v86.wasm",
    memory_size: 512 * 1024 * 1024,
    vga_memory_size: 8 * 1024 * 1024,
    screen: { container: screenEl, use_graphical_text: false },
    initial_state: { url: "arch_state.bin.zst" },
    filesystem: { baseurl: "arch/" },
    net_device: { type: "virtio", relay_url: "wss://relay.widgetry.org/" },
    preserve_mac_from_state_image: true,
    autostart: true,
    disable_speaker: true,
    fastboot: true
  });

  emu.add_listener("download-progress", function (p) {
    if (p.lengthComputable && p.total) {
      prog.style.width = Math.round(Math.min(1, p.loaded / p.total) * 100) + "%";
    }
  });
  emu.add_listener("emulator-ready", function () {
    phase = "boot";
    splash.style.display = "none";
    boot.style.display = "flex";
    hideHostCursor();
    nativeLock();
    setTimeout(function () { tryStartX(); }, 5000);
    setTimeout(function () { if (!canvasLooksLikeDesktop()) tryStartX(true); }, 45000);
    setTimeout(function () { grabMouse(); }, 400);
  });
  emu.add_listener("screen-set-size", function (arg) {
    var w = 0, h = 0;
    if (Array.isArray(arg)) { w = +arg[0]; h = +arg[1]; }
    if (w >= 320 && h >= 200 && canvasLooksLikeDesktop()) markDesk();
  });
  emu.add_listener("mouse-enable", function () {
    grabMouse();
    if (startedX) setTimeout(function () { if (canvasLooksLikeDesktop()) markDesk(); }, 1200);
  });
  setInterval(function () {
    if (canvasLooksLikeDesktop()) markDesk();
  }, 1000);
})();
</script>
</body>
</html>
