name: Build Helion IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-helion
  cancel-in-progress: true

jobs:
  prove:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build IPA
        run: |
          chmod +x scripts/build-ipa.sh
          HELION_VERSION=1.8.0 scripts/build-ipa.sh
          test -f dist/Helion.ipa
          python3 - <<'PY'
          import zipfile, os
          z=zipfile.ZipFile('dist/Helion.ipa')
          names=z.namelist()
          assert any(n.endswith('Helion.app/Helion') for n in names)
          assert any('Helion.app/computer/TinyCore.iso' in n for n in names)
          assert any('Helion.app/computer/v86.wasm' in n for n in names)
          assert any('Helion.app/computer/index.html' in n for n in names)
          sz=os.path.getsize('dist/Helion.ipa')
          print('ipa', sz)
          assert sz > 10*1024*1024
          PY

      - name: Import p12 and codesign
        env:
          CERT_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          CERT_PATH: ${{ runner.temp }}/signing.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain-db
          KEYCHAIN_PASSWORD: temporary-keychain-password
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          open(os.environ["CERT_PATH"], "wb").write(base64.b64decode(os.environ["CERT_BASE64"]))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | python3 -c 'import sys,re; t=sys.stdin.read(); m=re.search(r"\"([^\"]+)\"", t); print(m.group(1) if m else "")')
          echo "identity=$IDENT"
          APP="$GITHUB_WORKSPACE/build/ipa/Payload/Helion.app"
          codesign --force --sign "$IDENT" --entitlements "$GITHUB_WORKSPACE/Puck.entitlements" --generate-entitlement-der --timestamp=none "$APP"
          mkdir -p dist
          rm -f dist/Helion.ipa
          (cd "$GITHUB_WORKSPACE/build/ipa" && zip -r -y "$GITHUB_WORKSPACE/dist/Helion.ipa" Payload)
          ls -lh dist/Helion.ipa

      - name: Publish IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.0
          name: Puck 1.8.0 — Linux computer
          prerelease: false
          make_latest: true
          files: dist/Helion.ipa
          body: |
            # Puck 1.8.0 — حاسوب لينكس داخل التطبيق

            **هذا لينكس حقيقي.** الضيف هو Tiny Core Linux 11.0 (نواة 5.4.3-tinycore، سطح Xvesa/FLWM) يعمل داخل Puck عبر محاكي [v86](https://github.com/copy/v86) (x86 في WebAssembly).

            الآيفون ARM64 لا يحمّل نواة لينكس على العتاد. المسار المسموح هو المحاكاة داخل التطبيق — وهذا ما نُصدره. مو كسر، مو exploit.

            ## مؤشر الآيفون

            مؤشر النظام على الشاشة الرئيسية ما زال عبر **AssistiveTouch**: فعّله مرة، وأطفئ «إظهار القائمة دائماً» حتى يختفي الزر العائم. الإعداد يبقى.

            داخل لينكس: مؤشر الضيف (X11). اضغط الشاشة لالتقاط الماوس.

            ## This is real Linux (GPL)

            | Piece | License | Source |
            | --- | --- | --- |
            | Linux kernel in Tiny Core 11.0 | GPL-2.0 | [tinycorelinux.net/11.x](https://www.tinycorelinux.net/11.x/) · [kernel.org](https://www.kernel.org/) |
            | Tiny Core Linux 11.0 | mixed OSI | [tinycorelinux.net](https://tinycorelinux.net/) |
            | v86 | BSD-2-Clause | [copy/v86](https://github.com/copy/v86) |
            | SeaBIOS / VGA BIOS | LGPL | with v86 |
            | Puck pointer + shell | original | this repo |

            Sideload `Helion.ipa` (display name **Puck**, bundle `com.maaazn.helion`).
            First boot takes about a minute, then `startx` brings up the desktop.
