name: Build Helion IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-helion
  cancel-in-progress: true

jobs:
  prove:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build IPA
        run: |
          chmod +x scripts/build-ipa.sh
          HELION_VERSION=1.9.0 scripts/build-ipa.sh
          test -f dist/Helion.ipa
          python3 - <<'PY'
          import zipfile, os
          z=zipfile.ZipFile('dist/Helion.ipa')
          names=z.namelist()
          assert any(n.endswith('Helion.app/Helion') for n in names)
          assert any('Helion.app/computer/TinyCore.iso' in n for n in names)
          assert any('Helion.app/computer/v86.wasm' in n for n in names)
          assert any('Helion.app/computer/index.html' in n for n in names)
          sz=os.path.getsize('dist/Helion.ipa')
          print('ipa', sz)
          assert sz > 10*1024*1024
          PY

      - name: Import p12 and codesign
        env:
          CERT_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          CERT_PATH: ${{ runner.temp }}/signing.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain-db
          KEYCHAIN_PASSWORD: temporary-keychain-password
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          open(os.environ["CERT_PATH"], "wb").write(base64.b64decode(os.environ["CERT_BASE64"]))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | python3 -c 'import sys,re; t=sys.stdin.read(); m=re.search(r"\"([^\"]+)\"", t); print(m.group(1) if m else "")')
          echo "identity=$IDENT"
          APP="$GITHUB_WORKSPACE/build/ipa/Payload/Helion.app"
          codesign --force --sign "$IDENT" --entitlements "$GITHUB_WORKSPACE/Puck.entitlements" --generate-entitlement-der --timestamp=none "$APP"
          mkdir -p dist
          rm -f dist/Helion.ipa
          (cd "$GITHUB_WORKSPACE/build/ipa" && zip -r -y "$GITHUB_WORKSPACE/dist/Helion.ipa" Payload)
          ls -lh dist/Helion.ipa

      - name: Publish IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.0
          name: Puck Linux 1.9.0
          prerelease: false
          make_latest: true
          files: dist/Helion.ipa
          body: |
            # Puck Linux 1.9.0 — PUCK LINUX IN

            Full-screen Linux computer. Guest is **Tiny Core Linux 16**, kernel **6.12.11-tinycore** (GPL-2.0), running in [v86](https://github.com/copy/v86).

            The host mouse is hidden inside the app (`prefersPointerLocked` + CSS `cursor: none`). You use the Linux X11 cursor. AssistiveTouch remains the Home Screen pointer **outside** the app.

            iPhone does not give third-party apps Hypervisor.framework (including iOS 27). VirtualMac is iPad M-series. This is in-app x86 emulation — announced, licensed, not a jailbreak.

            ## This is real Linux (GPL)

            | Piece | License | Source |
            | --- | --- | --- |
            | Linux kernel 6.12.11-tinycore | GPL-2.0 | [tinycorelinux.net/16.x](https://www.tinycorelinux.net/16.x/) · [kernel.org](https://www.kernel.org/) |
            | Tiny Core Linux 16 | mixed OSI | [tinycorelinux.net](https://tinycorelinux.net/) |
            | v86 | BSD-2-Clause | [copy/v86](https://github.com/copy/v86) |
            | SeaBIOS / VGA BIOS | LGPL | with v86 |
            | Puck Linux shell | original | this repo |

            Sideload `Helion.ipa` (display name **Puck Linux**, bundle `com.maaazn.helion`).
            First boot takes about a minute, then the FLWM desktop.
