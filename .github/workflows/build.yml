name: Build Helion IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-helion
  cancel-in-progress: true

jobs:
  prove:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: iOS workload
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          dotnet workload install ios --skip-manifest-update || dotnet workload install ios

      - name: Publish Ryujinx Headless ios-arm64
        run: |
          set -euo pipefail
          chmod +x distribution/ios/compile.sh
          ./distribution/ios/compile.sh
          ls -lh "src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/Ryujinx.Headless.SDL2.dylib"

      - name: Import p12
        env:
          CERT_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          CERT_PATH: ${{ runner.temp }}/signing.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain-db
          KEYCHAIN_PASSWORD: temporary-keychain-password
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          open(os.environ["CERT_PATH"], "wb").write(base64.b64decode(os.environ["CERT_BASE64"]))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | python3 -c 'import sys,re; t=sys.stdin.read(); m=re.search(r"\"([^\"]+)\"", t); print(m.group(1) if m else "")')
          echo "IDENT=$IDENT" >> "$GITHUB_ENV"
          echo "identity=$IDENT"

      - name: Archive iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project src/MeloNX/MeloNX.xcodeproj \
            -scheme MeloNX \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Helion.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENT" \
            PRODUCT_BUNDLE_IDENTIFIER=com.maaazn.helion \
            INFOPLIST_KEY_CFBundleDisplayName=Helion \
            archive | tee "$RUNNER_TEMP/xcode.log" | tail -50

      - name: IPA
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/Helion.xcarchive/Products" -name '*.app' | head -1)
          echo "APP=$APP"
          ls -lh "$APP"
          mkdir -p dist Payload
          cp -R "$APP" Payload/Helion.app
          ENT="$GITHUB_WORKSPACE/helion.entitlements"
          codesign --force --sign "$IDENT" --entitlements "$ENT" --generate-entitlement-der --timestamp=none Payload/Helion.app || \
            codesign --force --sign "$IDENT" --timestamp=none Payload/Helion.app
          zip -r -y dist/Helion.ipa Payload
          ls -lh dist/Helion.ipa

      - name: Publish IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: Helion 0.2.0
          prerelease: false
          make_latest: true
          files: dist/Helion.ipa
          body: |
            code fixes.
