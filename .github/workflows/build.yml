name: Build Helion IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-helion
  cancel-in-progress: true

jobs:
  prove:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache UTM QEMU x86 stack
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: .qemu-ios
          key: utm-qemu-4.7.5-x86-v1

      - name: Vendor UTM iOS QEMU (x86_64 + deps + EDK2)
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          curl -L --fail -o "$RUNNER_TEMP/UTM.ipa" \
            https://github.com/utmapp/UTM/releases/download/v4.7.5/UTM.ipa
          mkdir -p "$RUNNER_TEMP/utm"
          unzip -q "$RUNNER_TEMP/UTM.ipa" -d "$RUNNER_TEMP/utm"
          python3 "$GITHUB_WORKSPACE/scripts/vendor-utm-qemu.py" \
            "$RUNNER_TEMP/utm/Payload/UTM.app" \
            "$GITHUB_WORKSPACE/.qemu-ios"
          ls -lh "$GITHUB_WORKSPACE/.qemu-ios/Frameworks" | head
          ls -lh "$GITHUB_WORKSPACE/.qemu-ios/bios"

      - name: Prove QEMU binaries
        run: |
          set -euo pipefail
          chmod +x scripts/prove.sh
          scripts/prove.sh "$GITHUB_WORKSPACE/.qemu-ios" "" "$RUNNER_TEMP/PROOF-qemu.txt"
          cat "$RUNNER_TEMP/PROOF-qemu.txt"

      - name: Compile Helion.app
        env:
          HELION_VERSION: "1.5.1"
          QEMU_DIR: ${{ github.workspace }}/.qemu-ios
        run: |
          set -euo pipefail
          chmod +x scripts/build-ipa.sh
          scripts/build-ipa.sh

      - name: Prove app contains engine
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/build/ipa/Payload/Helion.app"
          scripts/prove.sh "$GITHUB_WORKSPACE/.qemu-ios" "$APP" "$GITHUB_WORKSPACE/PROOF.txt"
          cat "$GITHUB_WORKSPACE/PROOF.txt"
          grep -q "PROOF_OK all" "$GITHUB_WORKSPACE/PROOF.txt"

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: helion-proof
          path: PROOF.txt
          if-no-files-found: error

      - name: Import p12 and codesign
        env:
          CERT_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          CERT_PATH: ${{ runner.temp }}/signing.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain-db
          KEYCHAIN_PASSWORD: temporary-keychain-password
        run: |
          set -euo pipefail
          test -n "${CERT_BASE64:-}"
          python3 - <<'PY'
          import base64, os
          open(os.environ["CERT_PATH"], "wb").write(base64.b64decode(os.environ["CERT_BASE64"]))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | python3 -c 'import sys,re; t=sys.stdin.read(); m=re.search(r"\"([^\"]+)\"", t); print(m.group(1) if m else "")')
          echo "identity=$IDENT"
          APP="$GITHUB_WORKSPACE/build/ipa/Payload/Helion.app"
          ENT="$GITHUB_WORKSPACE/app/Helion.entitlements"
          test -f "$GITHUB_WORKSPACE/PROOF.txt"
          grep -q "PROOF_OK all" "$GITHUB_WORKSPACE/PROOF.txt"
          if [[ -f "$APP/qemu-system-aarch64" ]]; then
            codesign --force --sign "$IDENT" --entitlements "$ENT" --generate-entitlement-der --timestamp=none "$APP/qemu-system-aarch64"
          fi
          if [[ -f "$APP/qemu-system-x86_64" ]]; then
            codesign --force --sign "$IDENT" --entitlements "$ENT" --generate-entitlement-der --timestamp=none "$APP/qemu-system-x86_64"
          fi
          for fw in "$APP"/Frameworks/*/*; do
            [[ -f "$fw" && -x "$fw" ]] || continue
            codesign --force --sign "$IDENT" --entitlements "$ENT" --generate-entitlement-der --timestamp=none "$fw" || \
            codesign --force --sign "$IDENT" --timestamp=none "$fw"
          done
          codesign --force --sign "$IDENT" --entitlements "$ENT" --generate-entitlement-der --timestamp=none "$APP"
          mkdir -p dist
          rm -f dist/Helion.ipa
          (cd "$GITHUB_WORKSPACE/build/ipa" && zip -r -y "$GITHUB_WORKSPACE/dist/Helion.ipa" Payload)
          ls -lh dist/Helion.ipa

      - name: Publish IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.1
          name: Helion 1.5.1
          prerelease: false
          make_latest: true
          files: dist/Helion.ipa
          body: |
            1.5.1 — code fixes.
