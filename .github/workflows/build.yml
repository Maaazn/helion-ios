name: Build Helion IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-helion
  cancel-in-progress: true

jobs:
  prove:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: iOS workload
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          dotnet workload install ios --skip-manifest-update || dotnet workload install ios

      - name: Build IPA
        run: |
          chmod +x scripts/build-ipa.sh distribution/ios/compile.sh
          HELION_VERSION=0.3.1 scripts/build-ipa.sh
          test -f dist/Helion.ipa
          python3 - <<'PY'
          import zipfile, os
          z=zipfile.ZipFile('dist/Helion.ipa')
          names=z.namelist()
          assert any(n.endswith('Helion.app/Helion') for n in names)
          assert any('Ryujinx.Headless.SDL2.dylib' in n for n in names)
          sz=os.path.getsize('dist/Helion.ipa')
          print('ipa', sz)
          assert sz > 20*1024*1024
          PY

      - name: Import p12 and codesign
        env:
          CERT_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          CERT_PATH: ${{ runner.temp }}/signing.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain-db
          KEYCHAIN_PASSWORD: temporary-keychain-password
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          open(os.environ["CERT_PATH"], "wb").write(base64.b64decode(os.environ["CERT_BASE64"]))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | python3 -c 'import sys,re; t=sys.stdin.read(); m=re.search(r"\"([^\"]+)\"", t); print(m.group(1) if m else "")')
          echo "identity=$IDENT"
          APP="$GITHUB_WORKSPACE/build/ipa/Payload/Helion.app"
          find "$APP" -name '*.framework' -o -name '*.dylib' | while read -r f; do
            codesign --force --sign "$IDENT" --timestamp=none "$f" || true
          done
          codesign --force --sign "$IDENT" --entitlements "$GITHUB_WORKSPACE/host/Helion.entitlements" --generate-entitlement-der --timestamp=none "$APP"
          mkdir -p dist
          rm -f dist/Helion.ipa
          (cd "$GITHUB_WORKSPACE/build/ipa" && zip -r -y "$GITHUB_WORKSPACE/dist/Helion.ipa" Payload)
          ls -lh dist/Helion.ipa

      - name: Publish IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.1
          name: Helion 0.3.1
          prerelease: false
          make_latest: true
          files: dist/Helion.ipa
          body: |
            code fixes.
