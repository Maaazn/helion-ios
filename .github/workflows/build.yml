name: Build Helion IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-helion
  cancel-in-progress: true

jobs:
  prove:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build QEMU for iphoneos
        timeout-minutes: 90
        run: |
          set -uo pipefail
          chmod +x scripts/build-qemu-ios.sh scripts/prove.sh scripts/build-ipa.sh
          scripts/build-qemu-ios.sh "$RUNNER_TEMP/qemu-ios"

      - name: Prove QEMU binaries
        run: |
          set -euo pipefail
          chmod +x scripts/prove.sh
          scripts/prove.sh "$RUNNER_TEMP/qemu-ios" "" "$RUNNER_TEMP/PROOF-qemu.txt"
          cat "$RUNNER_TEMP/PROOF-qemu.txt"

      - name: Compile Helion.app
        env:
          HELION_VERSION: "0.1.0"
          QEMU_DIR: ${{ runner.temp }}/qemu-ios
        run: |
          set -euo pipefail
          scripts/build-ipa.sh
          # build-ipa.sh zips internally; that zip is not a release.

      - name: Prove app contains engine
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/build/ipa/Payload/Helion.app"
          scripts/prove.sh "$RUNNER_TEMP/qemu-ios" "$APP" "$GITHUB_WORKSPACE/PROOF.txt"
          cat "$GITHUB_WORKSPACE/PROOF.txt"

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: helion-proof
          path: |
            PROOF.txt
            build/ipa/Payload/Helion.app/Helion
          if-no-files-found: error

      # No GitHub Release. No published IPA.
