name: Build Helion IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-helion
  cancel-in-progress: true

jobs:
  prove:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rust for pairable host
        run: |
          brew install cmake ninja || true
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          . "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios

      - name: Build IPA
        run: |
          . "$HOME/.cargo/env"
          chmod +x scripts/build-ipa.sh
          HELION_VERSION=3.2.4 scripts/build-ipa.sh
          test -f dist/Helion.ipa
          python3 - <<'PY'
          import zipfile, os
          z=zipfile.ZipFile('dist/Helion.ipa')
          names=z.namelist()
          assert any(n.endswith('Helion.app/Helion') for n in names)
          assert not any('TinyCore.iso' in n for n in names)
          assert not any('arch_state.bin.zst' in n for n in names)
          sz=os.path.getsize('dist/Helion.ipa')
          print('ipa', sz, 'files', len(names))
          assert sz > 80*1024
          PY

      - name: Import p12 and codesign
        env:
          CERT_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          CERT_PATH: ${{ runner.temp }}/signing.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain-db
          KEYCHAIN_PASSWORD: temporary-keychain-password
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          open(os.environ["CERT_PATH"], "wb").write(base64.b64decode(os.environ["CERT_BASE64"]))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | python3 -c 'import sys,re; t=sys.stdin.read(); m=re.search(r"\"([^\"]+)\"", t); print(m.group(1) if m else "")')
          echo "identity=$IDENT"
          APP="$GITHUB_WORKSPACE/build/ipa/Payload/Helion.app"
          codesign --force --sign "$IDENT" --entitlements "$GITHUB_WORKSPACE/Puck.entitlements" --generate-entitlement-der --timestamp=none "$APP"
          mkdir -p dist
          rm -f dist/Helion.ipa
          (cd "$GITHUB_WORKSPACE/build/ipa" && zip -r -y "$GITHUB_WORKSPACE/dist/Helion.ipa" Payload)
          ls -lh dist/Helion.ipa

      - name: Publish IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.4
          name: Puck 3.2.4
          prerelease: false
          make_latest: true
          files: dist/Helion.ipa
          body: |
            # Puck 3.2.4

            Pair as a computer (iOS Developer Mode). Then wear any pointer you want inside Puck.

            1. Open Puck
            2. Start pairing — allow Local Network
            3. Settings → Privacy & Security → Developer Mode → Pair with Puck
            4. Enter the PIN
            5. The studio opens. Any image is a cursor.

            Sideload `Helion.ipa` (display name **Puck**, bundle `com.maaazn.helion`).
