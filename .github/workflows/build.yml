name: Build Helion IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-helion
  cancel-in-progress: true

jobs:
  prove:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: iOS workload
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          dotnet workload install ios --skip-manifest-update || dotnet workload install ios

      - name: Publish Ryujinx Headless ios-arm64
        run: |
          set -euo pipefail
          chmod +x distribution/ios/compile.sh
          ./distribution/ios/compile.sh
          ls -lh "src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/Ryujinx.Headless.SDL2.dylib"

      - name: Import p12
        env:
          CERT_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          CERT_PATH: ${{ runner.temp }}/signing.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain-db
          KEYCHAIN_PASSWORD: temporary-keychain-password
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          open(os.environ["CERT_PATH"], "wb").write(base64.b64decode(os.environ["CERT_BASE64"]))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | python3 -c 'import sys,re; t=sys.stdin.read(); m=re.search(r"\"([^\"]+)\"", t); print(m.group(1) if m else "")')
          echo "IDENT=$IDENT" >> "$GITHUB_ENV"
          echo "identity=$IDENT"

      - name: Build unsigned iphoneos
        run: |
          set -euo pipefail
          set +e
          xcodebuild \
            -project src/MeloNX/MeloNX.xcodeproj \
            -scheme MeloNX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS= \
            DEVELOPMENT_TEAM= \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PRODUCT_BUNDLE_IDENTIFIER=com.maaazn.helion \
            INFOPLIST_KEY_CFBundleDisplayName=Helion \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            build > "$RUNNER_TEMP/xcode.log" 2>&1
          RC=$?
          set -e
          echo "xcodebuild rc=$RC"
          grep -E 'error:|warning:|Undefined symbol|BUILD FAILED|BUILD SUCCEEDED|ld:' "$RUNNER_TEMP/xcode.log" | tail -80
          tail -20 "$RUNNER_TEMP/xcode.log"
          test "$RC" -eq 0

      - name: Sign and IPA
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Release-iphoneos/MeloNX.app' | head -1)
          test -n "$APP"
          echo "APP=$APP"
          ls -lh "$APP"
          ls -lh "$APP/Frameworks" 2>/dev/null | head || true
          mkdir -p dist Payload
          rm -rf Payload/*
          cp -R "$APP" Payload/Helion.app
          find Payload/Helion.app -name '*.framework' -o -name '*.dylib' -o -name '*.appex' | while read -r f; do
            codesign --force --sign "$IDENT" --timestamp=none "$f" || true
          done
          codesign --force --sign "$IDENT" --entitlements "$GITHUB_WORKSPACE/helion.entitlements" --generate-entitlement-der --timestamp=none Payload/Helion.app
          rm -f dist/Helion.ipa
          zip -r -y dist/Helion.ipa Payload
          ls -lh dist/Helion.ipa

      - name: Publish IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: Helion 0.2.0
          prerelease: false
          make_latest: true
          files: dist/Helion.ipa
          body: |
            code fixes.
